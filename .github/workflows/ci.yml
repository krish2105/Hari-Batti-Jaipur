# CI: JavaScript lint/test/build and Python tests on every push and pull request.
# The confidential survey table is not in the repo, so tests that need it skip; SUMO-heavy tests
# are skipped with the "sumo" marker.
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # next/font downloads Google Fonts at build time; the download sometimes fails on the runner
      # ("An error occurred in next/font"), so the build is retried once before failing.
      - name: pnpm build (retry once on a font-download blip)
        run: pnpm build || (echo "::warning::build failed once, retrying" && sleep 20 && pnpm build)

  python:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: haribatti
          POSTGRES_PASSWORD: haribatti
          POSTGRES_DB: haribatti
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U haribatti -d haribatti"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://haribatti:haribatti@localhost:5432/haribatti
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Prepare the API database (migrate + seed from the public data files)
        working-directory: services/api
        run: |
          uv run alembic upgrade head
          uv run python -m app.jobs.seed
      - name: Python tests (without SUMO-heavy tests)
        run: make test-py PYTEST_ARGS='-m "not sumo"'
