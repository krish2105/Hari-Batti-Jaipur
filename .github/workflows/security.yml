# Security checks (P8 W16): known vulnerabilities in JS and Python dependencies, leaked secrets in
# the git history, and a CycloneDX SBOM (software bill of materials) kept with every run.
name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # every Monday: new advisories appear even when the code does not change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    name: Dependency audit (pnpm + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (fail on high or critical)
        run: pnpm audit --audit-level high
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - name: pip-audit every Python service
        run: |
          for s in api sim ml cv; do
            (cd services/$s && uv export --frozen --no-hashes --no-emit-project --all-groups -q \
              | grep -vE '^(-e |\./|\.\./|file:)' > /tmp/req-$s.txt)
            uvx pip-audit -r /tmp/req-$s.txt --no-deps --disable-pip --progress-spinner off
          done

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (whole history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - name: CycloneDX SBOMs (JS workspace + each Python service)
        run: |
          mkdir -p sbom
          npx -y @cyclonedx/cdxgen@12.8.4 -t js -o sbom/js.cdx.json --no-recurse .  # 12.x reads pnpm 12 lockfiles
          for s in api sim ml cv; do
            (cd services/$s && uv export --frozen --no-hashes --no-emit-project --all-groups -q \
              | grep -vE '^(-e |\./|\.\./|file:)' > /tmp/req-$s.txt)
            uvx --from cyclonedx-bom cyclonedx-py requirements /tmp/req-$s.txt -o sbom/$s.cdx.json
          done
          ls -la sbom
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom/, retention-days: 90 }
